<script>

const API_KEY_STORE="ecotec_api_key";
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const dbShim={doc(path){const key="ecotec_db_"+path;return{
 async set(data){localStorage.setItem(key,JSON.stringify(data))},
 onSnapshot(cb){const fire=()=>{const d=lsGet(key);cb({exists:!!d,data:()=>d})};fire();window.addEventListener("storage",e=>{if(e.key===key)fire()})}}}};
function aiShim(){const key=localStorage.getItem(API_KEY_STORE);if(!key)return null;
 const call=async input=>{const msgs=typeof input==="string"?[{role:"user",content:input}]:input;
  const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:3000,messages:msgs})});
  const d=await r.json();if(!r.ok)throw new Error((d.error&&d.error.message)||"Error de API");return{text:d.content.filter(b=>b.type==="text").map(b=>b.text).join("")}};
 const f=i=>call(i);f.json=async i=>{const t=(await call(i)).text;return JSON.parse(t.slice(t.indexOf("{"),t.lastIndexOf("}")+1))};return f}
const rt={async use(n){
 if(n==="db")return dbShim;
 if(n==="downloads")return{save({filename,data}){const a=document.createElement("a");a.href=URL.createObjectURL(data);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);return Promise.resolve()}};
 if(n==="sample")return aiShim();return null}};

if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const DIMS=["Salud financiera","Tracción y modelo de negocio","Impacto verificable","Gobierno y reportería","Equipo y ejecución"];
const Q=[
[0,"¿Qué estados financieros tienen disponibles?","o",[["Ninguno formal",1],["Solo registros propios o Excel",2],["Estados internos sin revisión",3],["Firmados por un contador",4],["Auditados o revisados por un tercero",5]]],
[0,"¿Cuántos meses de operación cubre su caja hoy?","o",[["Menos de 1 mes",1],["1 a 3 meses",2],["3 a 6 meses",3],["6 a 12 meses",4],["Más de 12 meses",5]]],
[1,"¿Cómo son sus ingresos hoy?","o",[["Aún sin ingresos",1],["Ventas puntuales, sin recurrencia",2],["Algunos clientes repiten",3],["Ingresos recurrentes de varios clientes",4],["Recurrentes, crecientes y diversificados",5]]],
[1,"¿Qué parte de sus ventas viene del cliente más grande?","o",[["Más del 70%",1],["50% a 70%",2],["30% a 50%",3],["15% a 30%",4],["Menos del 15%",5]]],
[2,"¿Cómo miden su impacto?","o",[["No lo miden",1],["Cifras sueltas sin fuente",2],["Indicadores propios con metodología básica",3],["Línea base e indicadores consistentes",4],["Verificado por tercero o estándar reconocido",5]]],
[2,"¿Con qué soporte cuentan para sus cifras de impacto? (varias)","m",["Datos crudos","Metodología escrita","Línea base","Verificación externa","Alineación con ODS o taxonomía"]],
[3,"¿Qué obligaciones tienen al día? (varias)","m",["Registro mercantil","RUT y DIAN","Contabilidad formal","Seguridad social de empleados","Impuestos"]],
[3,"¿Cada cuánto generan reportes de gestión?","o",[["Nunca",1],["Solo cuando se los piden",2],["Anual",3],["Trimestral",4],["Mensual, con indicadores",5]]],
[4,"¿Qué dedicación tienen los fundadores?","o",[["Ninguno dedica tiempo completo",1],["Un fundador a tiempo completo",2],["Fundadores a tiempo completo, sin equipo",3],["Fundadores y equipo básico",4],["Equipo completo con roles clave cubiertos",5]]],
[4,"¿Qué capacidades clave les faltan? (varias)","m",["Finanzas","Ventas","Operaciones","Tecnología","Medición de impacto","Jurídico"],true]];
const YC=["Que expliquen el negocio en dos frases","Una métrica semanal que muestre avance","Hablar con clientes antes de construir más","Preguntas difíciles, no órdenes","Cada reto con hipótesis y un experimento de 2 semanas"];
const FORM_URL="";
let S;try{S=JSON.parse(localStorage.getItem("ecotec_v2"))}catch(e){}
S=S||{h:{},docs:[],key:"",res:"",prof:"",prods:"",k:{a:{},ot:{},ev:{},notes:"",date:"",sent:false,fin:false,an:null},m:{1:{},2:{},3:{}},tasks:[],form:"",rem:8,chat:[]};
S.role=(()=>{try{return sessionStorage.getItem("ecotec_role")||""}catch(e){return""}})();
const save=()=>{try{sessionStorage.setItem("ecotec_role",S.role||"")}catch(e){}if(S.role==="m"){try{localStorage.setItem("ecotec_v2",JSON.stringify(S))}catch(e){}pubSoon()}};
const $=s=>document.querySelector(s),esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=d=>d?new Date(d+"T12:00").toLocaleDateString("es-CO",{day:"numeric",month:"short"}):"sin fecha";
const days=d=>Math.round((new Date(d+"T12:00")-new Date(new Date().toDateString()+" 12:00"))/864e5);
function qs(i){const q=Q[i],a=S.k.a[i];let s=null;if(q[2]=="o"){if(typeof a=="number")s=q[3][a][1]}else if(Array.isArray(a)&&a.length){const c=a.filter(x=>x!=="o").length;s=q[4]?Math.max(1,5-c):Math.max(1,Math.round(1+4*c/q[3].length))}if(s!==null&&!S.k.ev[i])s=Math.min(s,2);return s}
function score(){const per=DIMS.map((_,d)=>{const v=Q.map((q,i)=>q[0]==d?qs(i):null).filter(x=>x!==null);return v.length?v.reduce((a,b)=>a+b)/v.length:null});const v=per.filter(x=>x!==null);return{per,avg:v.length?v.reduce((a,b)=>a+b)/v.length:0}}
function banq(){const{avg,per}=score();return avg>=3&&per[0]>=3&&per[3]>=3}
function weakest(){const{per}=score();let m=0;per.forEach((p,i)=>{if((p??9)<(per[m]??9))m=i});return m}
function ans(i){const q=Q[i],a=S.k.a[i],o=S.k.ot[i]||"";if(q[2]=="o")return typeof a=="number"?q[3][a][0]:a=="o"?"Otra: "+o:"sin respuesta";if(!Array.isArray(a)||!a.length)return "sin respuesta";return a.map(x=>x==="o"?"Otra: "+o:q[3][x]).join("; ")}
function ctx(){const sc=score();let c=`STARTUP: ${S.h.name||"sin nombre"} | contacto: ${S.h.phone||""} ${S.h.mail||""}\nPERFIL DEL MENTOR: ${S.prof||"no registrado"}\nDIAGNÓSTICO (puntaje ${sc.avg.toFixed(1)}/5):\n`+Q.map((q,i)=>`- ${DIMS[q[0]]} | ${q[1]} -> ${ans(i)} (evidencia vista: ${S.k.ev[i]?"sí":"no"})`).join("\n");
c+=`\nNOTAS DEL KICKOFF: ${S.k.notes||"ninguna"}\nNOTAS DE SESIONES: ${[1,2,3].map(i=>S.m[i].notes?`M${i}: ${S.m[i].notes}`:"").join(" ")}\nDATOS CLAVE PEGADOS: ${S.key||"ninguno"}\nINVESTIGACIÓN EXTERNA: ${S.res||"ninguna"}\nTAREAS: ${S.tasks.map(t=>t.title+" ("+(t.done?"hecha":"pendiente")+", "+t.due+")").join("; ")||"ninguna"}\nPORTAFOLIO DEL BANCO: ${PORT_TXT} ${S.prods||""} Frentes marcados como posible match: ${(S.match||[]).join(", ")||"ninguno"}. Ventas anuales (millones COP): ${S.ventas||"no registradas"}\nDOCUMENTOS:\n`+[...S.docs,...EDOCS].map(d=>`[${d.n}] ${d.t?d.t.slice(0,6000):"(sin texto extraído)"}`).join("\n");return c.slice(0,26000)}
async function sj(p){try{const s=await rt.use("sample");if(!s)return null;return await s.json(p)}catch(e){return null}}
const RULES="Eres el apoyo de un mentor del programa Ecotec (Banco de Bogotá). El mentor lleva la conversación: tú das insumos, preguntas y ángulos, nunca guion de mentoría. Usa SOLO los datos dados y no inventes cifras. Marca lo que no consta. Metodología de referencia: aceleradoras globales (Y Combinator: hablar con clientes, una métrica semanal, preguntas difíciles; Techstars y similares). La financiación es una sugerencia, nunca una promesa. Adapta los consejos al perfil del mentor.\n";

<h3>2. ¿Qué frente elegible encaja?</h3><div class="chips">${FR.map(f=>`<span class="chip ${M.includes(f[0])?"on":""}" role="button" tabindex="0" onclick="tm('${f[0]}')">${f[0]}</span>`).join("")}</div>
${M.length?`<div class="res">${M.map(n=>`<p><b>${n}</b><br>${FR.find(f=>f[0]===n)[1]}</p>`).join("")}<b>Evidencia que debe reunir la startup</b><p>${EVID}</p></div>`:""}

function RM(){const A=alerts(),fa=document.activeElement&&document.activeElement.id,p=S.pg||"inicio";const N=[["inicio","Inicio","⌂"],["docs","Documentos","▤"],["kickoff","Kickoff y diagnóstico","✎"],["m1","Mentoría 1","1"],["m2","Mentoría 2","2"],["m3","Mentoría 3","3"],["crono","Cronograma","◷"],["banco","Portafolio del banco","❖"],["perfil","Mi perfil","☺"]];
const body=p=="inicio"?pgInicio(A):p=="docs"?pgDocs():p=="kickoff"?pgKick():p=="crono"?pgCrono():p=="banco"?pgBanco():p=="perfil"?pgPerfil():sess(+p[1]);
$("#app").innerHTML=`<div class="app"><nav class="side"><div class="logo">${mark}<span><i>ECO</i><b>TECH</b></span></div><small>Panel del mentor · Fundación Banco de Bogotá</small>${N.map(n=>`<div class="nv ${p==n[0]?"on":""} ${lockedP(n[0])?"lk":""}" role="button" tabindex="0" onclick="nav('${n[0]}')"><span>${n[2]}</span>${n[1]}${lockedP(n[0])?" 🔒":""}</div>`).join("")}<div class="nv" role="button" tabindex="0" onclick="S.role='';save();R()"><span>⇄</span>Cambiar de rol</div></nav><div><div class="top"><div><b>${S.h.name?esc(S.h.name):"Sin startup seleccionada"}</b><span>Mentor: Sergio · ${esc(S.h.phone)} ${esc(S.h.mail)}</span></div><button class="g n" onclick="nav('inicio')">Alertas (${A.length})</button></div><div class="main">${body}</div></div></div>`;

const RULES_E="Eres Mentor AI, el asistente de IA de Sergio (mentor del programa Ecotech, Banco de Bogotá) para la startup Denken. Responde con el marco de Sergio: su perfil, sus clases y las prácticas de aceleradoras que constan en los DATOS. Eres una IA: no te hagas pasar por Sergio, no inventes su biografía ni afirmes qué diría él fuera de lo que consta. Usa SOLO los DATOS; si falta algo di 'No tengo ese dato' e indica qué documento subir o qué llevar a Sergio. Sé directo y confrontativo con respeto: haz preguntas difíciles, da de 1 a 3 orientaciones de alto valor y cierra con una acción concreta. Los temas profundos o de decisión final se llevan a la mentoría con Sergio. No prometas financiación.\n";
function pick(r){S.role=r;if(r==="m"&&!S.h.name)S.h.name="Denken";save();R()}
function gate(){$("#app").innerHTML=`<div class="gate"><div class="gw"><div class="logo" style="font-size:30px">${mark}<span><i>ECO</i><b>TECH</b></span></div><h1>Bienvenido al programa de mentoría</h1><p class="s">Elige cómo quieres entrar. Es una prueba con un mentor (Sergio) y una startup (Denken).</p><div class="gc"><button class="go" onclick="pick('m')"><b>Soy mentor</b><small>Panel de Sergio: diagnóstico, sesiones y seguimiento.</small></button><button class="go" onclick="pick('e')"><b>Soy emprendedor</b><small>Mentor AI de Denken: consulta 24/7 con el enfoque de Sergio.</small></button></div><p class="s" style="margin-top:18px">IA: <a style="color:var(--bl);cursor:pointer" onclick="setKey()">configurar clave de Anthropic</a> (se guarda solo en este navegador). Mentor y emprendedor comparten datos si abres ambos roles en pestañas del mismo navegador.</p></div></div>`}
function pubSoon(){clearTimeout(pt);pt=setTimeout(()=>{if(!dbp)return;const k=S.k;try{dbp.doc("pub/denken").set({h:S.h,prof:S.prof||"",tasks:S.tasks,k:{date:k.date||"",fin:!!k.fin,pub:k.pub||"",score:score().avg,an:k.an&&!k.an.error?k.an:null},m:[1,2,3].map(i=>({date:S.m[i].date||"",fin:!!S.m[i].fin,goal:S.m[i].goal||"",pub:S.m[i].pub||""})),t:Date.now()}).catch(()=>{})}catch(e){}},1500)}
async function initDb(){try{const d=await rt.use("db");if(!d)return;dbp=d;d.doc("pub/denken").onSnapshot(s=>{PUB=s.exists?s.data():null;if(S.role==="e"&&E.view!=="chat")R()},()=>{});d.doc("docsE/denken").onSnapshot(s=>{EDOCS=s.exists?(s.data().list||[]):[];if(S.role==="m"&&S.pg==="docs")R()},()=>{});if(S.role==="m")pubSoon()}catch(e){}}
function ctxE(){const P=PUB||{},k=P.k||{},an=k.an;return(`STARTUP: Denken (Programa Ecotech).\nMODO: ${EM[E.mode][0]} - ${EM[E.mode][1]}\nCLASES DE SERGIO: ${KBC}\nREFERENTES: ${KBY}\nPERFIL DE SERGIO: ${P.prof||"No registrado todavía"}\nDIAGNÓSTICO: ${an?JSON.stringify({puntaje:k.score,resumen:an.resumen,fortalezas:an.fortalezas,brechas:an.brechas,linea_base:an.linea_base}):"No disponible todavía"}\nRESÚMENES DE SESIONES (de Sergio): kickoff: ${k.pub||"-"}; `+(P.m||[]).map((m,i)=>`M${i+1}: ${m.goal||""} ${m.pub||"-"}`).join("; ")+`\nTAREAS: ${(P.tasks||[]).map(t=>t.title+" ("+(t.done?"hecha":"pendiente")+", "+(t.due||"sin fecha")+")").join("; ")||"ninguna"}\nDOCUMENTOS DE LA STARTUP:\n`+E.docs.map(d=>`[${d.n}] ${(d.t||"").slice(0,5000)}`).join("\n")).slice(0,24000)}
function newChat(){const c={id:Date.now(),title:"Nuevo chat",msgs:[]};E.chats.unshift(c);E.cur=c.id;E.view="chat";saveE();R()}
const ev=v=>{E.view=v;saveE();R()},kb=()=>{E.kb=!E.kb;R()};
async function sendE(t){let c=E.chats.find(x=>x.id===E.cur);if(!c){newChat();c=E.chats[0]}t=(t||($("#ei")||{}).value||"").trim();if(!t)return;c.msgs.push({role:"user",content:t});if(c.title==="Nuevo chat")c.title=t.slice(0,30);c.msgs.push({role:"assistant",content:"Pensando…"});saveE();R();
const h=c.msgs.slice(0,-1).slice(-9);h[0]={role:"user",content:RULES_E+"\nDATOS:\n"+ctxE()+"\n\nCONVERSACIÓN:\n"+h[0].content};let out="No pude responder ahora. Intenta de nuevo.";try{const sp=await rt.use("sample");out=sp?(await sp(h,{cache:false})).text:"Configura la IA (clave de Anthropic) en la pantalla de inicio."}catch(e){}c.msgs[c.msgs.length-1].content=out;saveE();R()}
async function edocs(files){for(const f of files){const d={n:f.name,t:"",st:"Leyendo…"};E.docs.push(d);R();try{if(/\.pdf$/i.test(f.name)&&window.pdfjsLib){const p=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;for(let i=1;i<=Math.min(p.numPages,40);i++){const c=await(await p.getPage(i)).getTextContent();d.t+=c.items.map(x=>x.str).join(" ")+"\n"}}else if(/\.docx$/i.test(f.name)&&window.mammoth){d.t=(await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()})).value}else if(/\.(txt|csv)$/i.test(f.name)){d.t=await f.text()}}catch(e){}d.t=d.t.slice(0,30000);d.st=d.t.trim().length>40?`Leído: ${d.t.length} caracteres`:"Sin texto extraíble (¿PDF escaneado?).";saveE();R()}shareDocs()}
function shareDocs(){try{dbp&&dbp.doc("docsE/denken").set({list:E.docs.slice(-8).map(d=>({n:d.n,t:(d.t||"").slice(0,8000)}))}).catch(()=>{})}catch(e){}}
const rmDoc=i=>{E.docs.splice(i,1);saveE();shareDocs();R()};
function kbHtml(){const P=PUB||{},an=(P.k||{}).an,card=(t,d,on)=>`<div class="kc"><b>${t}</b>${on?'<span class="on-tag">Activo en la IA</span>':'<span class="st"> · Pendiente</span>'}<p class="s" style="margin:4px 0 0">${d}</p></div>`;
return`<div class="modal" onclick="if(event.target===this)kb()"><div class="mb"><div class="mh"><h2>Base de conocimiento</h2><p style="margin:0;color:#dbe8fb">Lo que Mentor AI usa para responderte.</p></div><div style="padding:18px">${card("Clases de Sergio · Estrategia Competitiva Aplicada","Temas y casos vistos en clase. Hoy constan solo los títulos.",true)}${card("Perfil profesional de Sergio",P.prof?esc(P.prof.slice(0,260)):"Sergio aún no lo ha completado en su panel.",!!P.prof)}${card("Referentes de aceleradoras","Resumen de prácticas tipo Y Combinator. Los documentos de Rockstart y Silicon Valley están por cargar.",true)}${card("Diagnóstico de la startup",an?esc((an.resumen||"").slice(0,260)):"Disponible cuando Sergio envíe el diagnóstico del kickoff.",!!an)}
<div class="kc"><b>Mis documentos</b><span class="on-tag">Activo en la IA</span><p class="s" style="margin:4px 0 8px">Estados financieros, ventas, presentaciones. Sergio también los verá.</p><input type="file" id="ef" multiple accept=".pdf,.docx,.txt,.csv"><ul>${E.docs.map((d,i)=>`<li>${esc(d.n)} <span class="st">${esc(d.st)}</span> <a style="color:var(--bl);cursor:pointer" onclick="rmDoc(${i})">Quitar</a></li>`).join("")}</ul></div><button onclick="kb()">Cerrar</button></div></div></div>`}
function RE(){const c=E.chats.find(x=>x.id===E.cur),v=E.view,P=PUB||{},k=P.k||{},M=P.m||[{},{},{}];let body="";
if(v==="chat"){const has=c&&c.msgs.length,S3=["Ayúdame a explicar mi negocio en dos frases","¿Qué métrica semanal debería seguir?","¿Qué le falta a mi startup para ser financiable?"];
body=(has?"":`<div class="banner">Resuelve tus dudas con el enfoque de Sergio</div><div class="sug">${S3.map(x=>`<div role="button" tabindex="0" onclick="sendE('${x}')">${x}</div>`).join("")}</div><div class="msg"><div class="av">AI</div><div class="bub">Hola, soy Mentor AI, el asistente de IA de Sergio para Denken. Respondo con su perfil, sus clases, prácticas de aceleradoras y tus documentos. Lo más profundo lo trabajamos con Sergio en cada mentoría.${dbp?"":"\n\nSin conexión con el panel de Sergio: el cronograma y los resúmenes no se mostrarán."}</div></div>`)+(has?c.msgs.map((m,i)=>`<div class="msg ${m.role==="user"?"u":""}"><div class="av">${m.role==="user"?"D":"AI"}</div><div><div class="bub">${esc(m.content)}</div>${m.role==="assistant"&&i===c.msgs.length-1&&m.content!=="Pensando…"?`<div class="acts"><button class="g" onclick="sendE('Explícamelo más simple')">Más simple</button><button class="g" onclick="sendE('Dame un ejemplo real aplicado a mi startup')">Ejemplo real</button></div>`:""}</div></div>`).join(""):"")}
else if(v==="crono"){const T=(P.tasks||[]).slice().sort((a,b)=>(a.due||"9").localeCompare(b.due||"9")),D=[["Kickoff",k.date,k.fin],...M.map((m,i)=>["Mentoría "+(i+1),m.date,m.fin])].filter(x=>x[1]);body=`<h2>Cronograma</h2><p class="s">Lo define Sergio y se actualiza solo.</p><div class="card"><h3>Sesiones</h3>${D.map(x=>`<div class="dt"><b>${fmt(x[1])}</b><span>${x[0]} · ${x[2]?"Realizada":"Por hacer"}</span></div>`).join("")||'<p class="s">Sergio aún no agenda sesiones.</p>'}</div><div class="card"><h3>Tareas y entregables</h3>${T.map(t=>`<div class="dt"><b>${t.due?fmt(t.due):"Sin fecha"}</b><span class="${t.done?"done":""}">${esc(t.title)} · ${t.o==="m"?"Sergio":"Denken"}</span></div>`).join("")||'<p class="s">Aún no hay tareas.</p>'}</div>`}
else{const L=[["Kickoff",k.fin,k.date,"",k.pub,0],...M.map((m,i)=>["Mentoría "+(i+1),m.fin,m.date,m.goal,m.pub,i+1])];body=`<h2>Mis mentorías</h2><p class="s">Cada resumen se desbloquea cuando Sergio finaliza la sesión.</p>${L.map((x,i)=>{const op=x[1];return`<div class="card ${op?"":"lock"}"><h3>${op?"✓ ":"🔒 "}${x[0]}${x[2]?" · "+fmt(x[2]):""}</h3>${op?`${x[3]?`<p><b>Objetivo:</b> ${esc(x[3])}</p>`:""}<p>${esc(x[4]||"Sergio aún no escribió el resumen.")}</p>${(P.tasks||[]).filter(t=>t.s===x[5]).map(t=>`<div class="dt"><b>${t.due?fmt(t.due):"Sin fecha"}</b><span>${esc(t.title)}</span></div>`).join("")}`:'<p class="s">Se desbloquea al finalizar la sesión anterior.</p>'}</div>`}).join("")}`}
$("#app").innerHTML=`<div class="ea"><aside class="es"><div class="logo">${mark}<span><i>ECO</i><b>TECH</b></span></div><button onclick="newChat()">+ Nuevo chat</button><div class="sec">Mentor AI · chats</div>${E.chats.map(x=>`<div class="nv ${x.id===E.cur&&v==="chat"?"on":""}" role="button" tabindex="0" onclick="E.cur=${x.id};E.view='chat';saveE();R()"><span>◌</span>${esc(x.title)}</div>`).join("")||'<p class="s" style="padding:0 10px">Aún no tienes chats.</p>'}<div class="sec">Tu proceso</div><div class="nv ${v==="crono"?"on":""}" role="button" tabindex="0" onclick="ev('crono')"><span>◷</span>Cronograma</div><div class="nv ${v==="mentorias"?"on":""}" role="button" tabindex="0" onclick="ev('mentorias')"><span>✓</span>Mis mentorías</div><div class="nv" role="button" tabindex="0" onclick="S.role='';save();R()"><span>⇄</span>Cambiar de rol</div></aside><div class="ech"><div class="eh"><div class="tt"><b>Mentor AI · apoyo de Sergio</b><span>Denken · Programa Ecotech</span></div><select aria-label="Modo de respuesta" title="${esc(EM[E.mode][1])}" onchange="E.mode=+this.value;saveE()">${EM.map((m,i)=>`<option value="${i}" ${E.mode===i?"selected":""}>${m[0]}</option>`).join("")}</select><button class="g" onclick="kb()">Base de conocimiento</button></div><div class="ebody" id="eb"><div class="ewrap">${body}</div></div>${v==="chat"?`<div class="ein"><div class="box"><input id="ei" aria-label="Tu pregunta" placeholder="Pregunta sobre tu startup, finanzas o estrategia…" onkeydown="if(event.key==='Enter')sendE()"><button onclick="sendE()">Enviar</button></div></div>`:""}</div></div>${E.kb?kbHtml():""}`;
const b=$("#eb");if(b)b.scrollTop=b.scrollHeight;const f=$("#ef");if(f)f.onchange=e=>{edocs([...e.target.files]);e.target.value=""};if(v==="chat"&&!E.kb&&$("#ei"))$("#ei").focus()}

async function cs(){const i=$("#ci"),t=i.value.trim();if(!t)return;i.value="";S.chat.push({role:"user",content:t});cm();const sp=await rt.use("sample").catch(()=>null);if(!sp){S.chat.push({role:"assistant",content:"Configura la IA (clave de Anthropic) en la pantalla de inicio."});cm();return}

R();initDb();
